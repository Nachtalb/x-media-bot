[package]
name = "x-media-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Telegram bot that sends the photos, videos and GIFs of X/Twitter links, via the FxTwitter API."
license = "MIT"
authors = ["Nachtalb <na@nachtalb.io>"]
repository = "https://github.com/Nachtalb/x-media-bot"
readme = "README.md"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "fs"] }
futures-util = "0.3"
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
